<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackside</title>
<meta name="description" content="A motorsports photographer experience: choose your moment, your settings and your lens, take the shot, and see whether it lands.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="crumbs" id="crumbs" aria-label="Your path"></nav>

  <!-- Decision screens (Start, Trackside, Podium, and the lens questions) -->
  <section class="screen" id="ask" aria-labelledby="askTitle">
    <figure class="hero" id="askHero"><div class="hero-img" id="askHeroImg"></div><span class="tag" id="askTag"></span></figure>
    <h1 id="askTitle"></h1>
    <p class="body" id="askBody"></p>
    <p class="q" id="askQ"></p>
    <div class="options" id="askOptions"></div>
    <div class="row foot">
      <button class="ghost small" id="back">Back</button>
      <div class="collect" id="collect" aria-label="Shots you've found"></div>
    </div>
  </section>

  <!-- Taking the shot -->
  <section class="screen" id="shoot" hidden aria-labelledby="shootTitle">
    <span class="tag inline" id="shootTag"></span>
    <h2 id="shootTitle">Take the shot</h2>
    <p class="body" id="shootBody"></p>
    <div class="camera">
      <!-- Looking through the optical viewfinder -->
      <div class="eyepiece">
        <div class="vf" id="vf" aria-hidden="true">
          <div class="vf-img" id="vfImg"></div>
          <div class="grain"></div>
          <div class="afgrid" id="afgrid"></div>
          <div class="af" id="af" data-state="idle"><i></i><i></i><i></i><i></i></div>
          <div class="flash" id="flash"></div>
        </div>
        <div class="ovf" id="ovf" aria-hidden="true">
          <span class="fc" id="ovfFocus">●</span>
          <span id="ovfShutter">60</span>
          <span id="ovfAp">8.0</span>
          <span class="scale">−..2..1..<b id="ovfNeedle">▲</b>..1..2..+</span>
          <span>ISO 200</span>
          <span class="shots">[<b id="ovfShots">312</b>]</span>
        </div>
      </div>
      <!-- The camera's top plate: status LCD, mode dial, two-stage shutter button -->
      <div class="topplate">
        <div class="lcd" aria-hidden="true">
          <span class="lcd-mode">M</span>
          <span class="lcd-big" id="lcdShutter">1/60</span>
          <span class="lcd-big" id="lcdAp">F8.0</span>
          <span id="lcdDrive">Single</span>
          <span id="lcdLens">400mm</span>
          <span>ISO 200</span>
          <span>AF-S · ONE SHOT</span>
        </div>
        <div class="dial" aria-hidden="true"><span>M</span></div>
        <button class="release" id="shutter" data-stage="idle" aria-label="Shutter button. Hold to half-press and focus. Press Enter, or push down, to take the picture."><span class="cap"></span></button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="row keys">
      <span class="legend"><kbd>Hold</kbd> half-press to focus <kbd>Push down</kbd> full press to shoot <span class="kb">· Keys: <kbd>Space</kbd> half, <kbd>Enter</kbd> full</span></span>
      <button class="ghost small" id="sound" aria-pressed="true">Sound on</button>
    </div>
  </section>

  <!-- The result -->
  <section class="screen" id="result" hidden aria-labelledby="resTitle">
    <article class="print">
      <div class="print-frame" id="printFrame"><div class="print-img" id="printImg"></div></div>
      <div class="print-body">
        <div class="row">
          <span class="counter" id="resPath"></span>
          <span class="stamp" id="resStamp" data-grade="great">Great shot</span>
        </div>
        <h2 id="resTitle"></h2>
        <p class="note" id="resText"></p>
        <button class="solid" id="resAction"></button>
      </div>
    </article>
  </section>

  <p class="sr-only" id="announce" aria-live="polite"></p>
</main>
<script src="app.js"></script>
</body>
</html>
