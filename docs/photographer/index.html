<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackside</title>
<meta name="description" content="A motorsports photographer experience: choose your moment, your settings and your lens, take the shot, and see whether it lands.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="crumbs" id="crumbs" aria-label="Your path"></nav>

  <!-- Decision screens (Start, Trackside, Podium, and the lens questions) -->
  <section class="screen" id="ask" aria-labelledby="askTitle">
    <figure class="hero" id="askHero"><div class="hero-img" id="askHeroImg"></div><span class="tag" id="askTag"></span></figure>
    <h1 id="askTitle"></h1>
    <p class="body" id="askBody"></p>
    <p class="q" id="askQ"></p>
    <div class="options" id="askOptions"></div>
    <div class="row foot">
      <button class="ghost small" id="back">Back</button>
      <div class="collect" id="collect" aria-label="Shots you've found"></div>
    </div>
  </section>

  <!-- Taking the shot -->
  <section class="screen" id="shoot" hidden aria-labelledby="shootTitle">
    <span class="tag inline" id="shootTag"></span>
    <h2 id="shootTitle">Take the shot</h2>
    <p class="body" id="shootBody"></p>
    <div class="vf-wrap">
      <div class="vf" id="vf" aria-hidden="true">
        <div class="vf-img" id="vfImg"></div>
        <div class="grain"></div>
        <div class="thirds"></div>
        <div class="corners"><i></i><i></i><i></i><i></i></div>
        <div class="af" id="af" data-state="idle"></div>
        <div class="mode-tag" id="modeTag" hidden>Burst</div>
        <div class="readout">
          <span id="roShutter"></span><span id="roAp"></span><span id="roLens"></span>
          <span class="meter"><span id="meterFill"></span></span>
          <span id="focusWord">MF</span>
        </div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="controls">
      <p class="hint" id="hint">Hold the shutter (or Space) until it beeps, then let go.</p>
      <button class="shutter" id="shutter" aria-label="Shutter. Hold to focus, release to shoot."><span></span></button>
      <button class="ghost small" id="sound" aria-pressed="true">Sound on</button>
    </div>
  </section>

  <!-- The result -->
  <section class="screen" id="result" hidden aria-labelledby="resTitle">
    <article class="print">
      <div class="print-frame" id="printFrame"><div class="print-img" id="printImg"></div></div>
      <div class="print-body">
        <div class="row">
          <span class="counter" id="resPath"></span>
          <span class="stamp" id="resStamp" data-grade="great">Great shot</span>
        </div>
        <h2 id="resTitle"></h2>
        <p class="note" id="resText"></p>
        <button class="solid" id="resAction"></button>
      </div>
    </article>
  </section>

  <p class="sr-only" id="announce" aria-live="polite"></p>
</main>
<script src="app.js"></script>
</body>
</html>
